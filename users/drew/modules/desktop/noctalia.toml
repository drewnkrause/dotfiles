[osd.kinds]
media = false

[shell]
font_family = "JetBrainsMono NF"
niri_overview_type_to_launch_enabled = true
polkit_agent = true

    [shell.greeter_sync]
    auto_sync = true

    [shell.launcher]
    compact = true

[theme]
builtin = "Gruvbox"
community_palette = "ADW"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "niri" ]

[wallpaper]
directory = "/home/drew/Downloads"

    [wallpaper.default]
    path = "/home/drew/Downloads/background.jpg"

    [wallpaper.last]
    path = "/home/drew/Downloads/background.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/drew/Downloads/background.jpg"

    [[wallpaper.favorite]]
    builtin_palette = "Gruvbox"
    palette_source = "builtin"
    path = "/home/drew/Downloads/background.jpg"
    theme_mode = "dark"

[weather]
unit = "imperial"

[widget.clipboard]
enabled = false

[widget.clock]
format = "{:%I:%M}"

    [widget.clock.actions]
    left = "panel-toggle control-center"

[widget.control-center]
enabled = false

[widget.media]
hide_when_no_media = true

[widget.network]
show_label = false

[widget.notifications]
enabled = false

[widget.tray]
drawer = true
hidden = [ "spotify" ]
